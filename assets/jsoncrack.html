<!DOCTYPE html>
<html>
<header>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #jsoncrackEmbed {
            flex: 1;
            order: 2;
            border: none;
            overflow: none;
            width: 100%;
            height: 100%;
        }
    </style>
</header>

<body>
    <script>
        const params = new URLSearchParams(window.location.search);

        const iframe = document.createElement('iframe');
        iframe.id = 'jsoncrackEmbed';
        iframe.src = params.get('src') || 'src/index.html';
        document.body.appendChild(iframe);

        // Listen for messages from the child iframe (Next.js widget)
        window.addEventListener('message', (event) => {
            const data = event.data;
            // Forward messages from the iframe to the parent (Flutter)
            if (data && typeof data === 'object') {
                window.parent.postMessage(data, '*');
            }
        });

        // Listen for messages from the parent (Flutter)
        // Flutter sends {type: 'init', data: {json, options}} on init and on JSON update
        iframe.addEventListener('load', () => {
            const parentListener = (event) => {
                const data = event.data;
                if (data && data.type === 'init' && data.data) {
                    // Forward the inner data ({json, options}) to the iframe
                    iframe.contentWindow.postMessage(data.data, '*');
                }
            };
            window.addEventListener('message', parentListener);
        });
    </script>
</body>

</html>
