name: jsoncrack
description: "Embed the JsonCrack JSON viewer as a widget in your Flutter app. Visualize JSON data as an interactive graph."
version: 0.2.0
repository: https://github.com/flrnsbt/jsoncrack
homepage: https://pub.dev/packages/jsoncrack
documentation: https://raw.githubusercontent.com/flrnsbt/jsoncrack/refs/heads/main/README.md

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  webview_all: ^1.4.4
  web: ^1.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  assets:
  - assets/jsoncrack.html
